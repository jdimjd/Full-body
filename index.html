<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JD's Aesthetic Tracker</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="apple-touch-icon" href="./logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --theme-base: rgb(16, 185, 129);
            --theme-alpha-10: rgba(16, 185, 129, 0.1);
            --theme-alpha-20: rgba(16, 185, 129, 0.2);
            --theme-alpha-30: rgba(16, 185, 129, 0.3);
            --theme-alpha-50: rgba(16, 185, 129, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #e5e7eb;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        /* Hide horizontal scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Remove arrows from number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .set-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .set-card { transition: all 0.3s ease; }
        
        .set-completed .set-btn {
            background-color: var(--theme-base) !important;
            border-color: var(--theme-base) !important;
            color: #000 !important;
            box-shadow: 0 0 12px var(--theme-alpha-30);
        }
        .set-completed {
            background-color: var(--theme-alpha-10) !important;
            border-color: var(--theme-alpha-30) !important;
        }

        /* Fullscreen Timer Pulse */
        @keyframes timerPulse {
            0% { box-shadow: 0 0 0 0 var(--theme-alpha-50); border-color: var(--theme-base); transform: scale(1); }
            50% { box-shadow: 0 0 0 30px rgba(0,0,0,0); border-color: rgba(255,255,255,0.2); transform: scale(1.02); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); border-color: var(--theme-base); transform: scale(1); }
        }
        .timer-ring-pulse { animation: timerPulse 2s infinite ease-in-out; }

        /* Toast Animation */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        .toast-animate { animation: slideUpFade 3s ease-in-out forwards; }
    </style>
</head>
<body class="min-h-screen pb-28 transition-colors duration-500">

    <div class="sticky top-0 z-30 bg-black/80 backdrop-blur-xl border-b border-white/10 pt-4 pb-3 px-4 shadow-[0_10px_30px_rgba(0,0,0,0.8)]">
        <div class="max-w-md mx-auto">
            <!-- App Title & Report Button -->
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-black text-[var(--theme-base)] tracking-tight transition-colors duration-500">
                    JD's <span class="text-white">TRACKER</span>
                </h1>
                <button onclick="openMonthlyReport()" class="bg-white/5 border border-white/10 text-xs font-bold px-3 py-1.5 rounded-lg text-gray-300 hover:text-white transition-colors flex items-center gap-1 backdrop-blur-md">
                    📊 30-Day Report
                </button>
            </div>
            
            <!-- Weekly Tracker Bubbles -->
            <div class="flex justify-between items-center mb-4 bg-white/5 p-2 rounded-xl border border-white/10">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest w-12 text-center">Week</div>
                <div id="weekly-bubbles" class="flex gap-2 flex-1 justify-center">
                    <!-- Bubbles injected by JS -->
                </div>
            </div>

            <!-- Day Selector Tabs -->
            <div id="day-tabs" class="flex gap-2 overflow-x-auto hide-scrollbar snap-x">
                <!-- Tabs injected by JS -->
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 mt-6">
        
        <!-- Bodyweight Logging Section -->
        <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-4 mb-6 shadow-lg flex justify-between items-center">
            <div>
                <div class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">⚖️ Bodyweight</div>
                <div class="text-sm text-gray-500"><span id="bw-last-display">--</span> kg (Last)</div>
            </div>
            <div class="flex gap-2 items-center">
                <input type="number" id="bw-input" placeholder="0.0" class="w-16 h-10 bg-black border border-white/10 rounded-xl text-center text-sm font-bold text-white focus:outline-none focus:border-[var(--theme-base)] transition-colors">
                <button onclick="logBodyweight()" class="h-10 px-4 rounded-xl font-bold text-xs bg-[var(--theme-alpha-20)] text-[var(--theme-base)] border border-[var(--theme-alpha-30)] hover:bg-[var(--theme-alpha-30)] transition-colors">
                    Log
                </button>
            </div>
        </div>

        <!-- Current Day Title & Done Badge -->
        <div class="mb-4 flex justify-between items-center">
            <div>
                <h2 id="day-title-main" class="text-2xl font-bold text-white tracking-tight">Loading...</h2>
                <p id="day-title-sub" class="text-[var(--theme-base)] text-sm font-semibold transition-colors duration-500">Loading...</p>
            </div>
            <span id="day-done-badge" class="hidden bg-[var(--theme-alpha-20)] text-[var(--theme-base)] border border-[var(--theme-alpha-30)] text-xs font-bold px-3 py-1 rounded-full items-center gap-1 transition-colors duration-500 shadow-[0_0_15px_var(--theme-alpha-20)]">
                ✓ Workout Done
            </span>
        </div>

        <!-- Routine container for exercises -->
        <div id="routine-container" class="space-y-4"></div>
    </div>

    <div id="timer-overlay" class="fixed inset-0 z-50 bg-black flex-col items-center justify-center transition-opacity duration-500 backdrop-blur-sm opacity-0 pointer-events-none hidden flex">
        <div class="w-72 h-72 rounded-full border border-white/10 flex flex-col items-center justify-center shadow-[inset_0_0_50px_rgba(255,255,255,0.05),0_0_60px_var(--theme-alpha-20)] mb-12 relative overflow-hidden bg-black transition-shadow duration-500">
            <div class="absolute inset-0 rounded-full border-[6px] timer-ring-pulse transition-colors duration-500"></div>
            <span id="timer-display" class="text-7xl font-black text-white tabular-nums tracking-tighter relative z-10">00:00</span>
            <span class="text-xs text-[var(--theme-base)] uppercase tracking-[0.3em] mt-4 font-bold relative z-10 transition-colors duration-500">Recovery</span>
        </div>
        <div class="flex gap-4 relative z-10">
            <button onclick="addTimerTime(30)" class="px-8 py-4 rounded-2xl border border-white/10 bg-white/5 text-white font-bold hover:bg-white/10 transition-colors backdrop-blur-md">+30s</button>
            <button onclick="stopTimer()" class="px-8 py-4 rounded-2xl border border-[var(--theme-alpha-30)] text-[var(--theme-base)] bg-[var(--theme-alpha-10)] font-bold hover:bg-[var(--theme-alpha-20)] transition-colors backdrop-blur-md">Skip Rest</button>
        </div>
    </div>

    <div id="report-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 hidden flex p-4">
        <div class="bg-[#0a0a0a] border border-white/10 rounded-3xl p-6 w-full max-w-sm shadow-[0_20px_50px_rgba(0,0,0,1)] transform scale-95 transition-transform duration-300" id="report-card">
            <div class="text-center mb-6">
                <div class="text-4xl mb-2">📈</div>
                <h3 class="text-xl font-black text-white tracking-tight">30-Day Report</h3>
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-widest mt-1">JD's Aesthetic Tracker</p>
            </div>

            <div class="space-y-3 mb-6">
                <!-- Total Workouts -->
                <div class="bg-white/5 border border-white/10 rounded-2xl p-4 flex justify-between items-center">
                    <span class="text-sm font-bold text-gray-400">Total Workouts</span>
                    <span id="rep-workouts" class="text-xl font-black text-[var(--theme-base)] transition-colors duration-500">0</span>
                </div>
                <!-- Total Volume -->
                <div class="bg-white/5 border border-white/10 rounded-2xl p-4 flex justify-between items-center">
                    <span class="text-sm font-bold text-gray-400">Volume Lifted</span>
                    <span id="rep-volume" class="text-xl font-black text-white">0 <span class="text-xs text-gray-500">kg</span></span>
                </div>
                <!-- Bodyweight Change -->
                <div class="bg-white/5 border border-white/10 rounded-2xl p-4 flex justify-between items-center">
                    <span class="text-sm font-bold text-gray-400">Bodyweight Δ</span>
                    <span id="rep-bw" class="text-xl font-black text-white">--</span>
                </div>
            </div>

            <button onclick="closeMonthlyReport()" class="w-full py-4 rounded-xl font-black text-sm text-black bg-white hover:bg-gray-200 transition-colors">
                Close Report
            </button>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

    <script>
        const FB_MWF = [
            { name: 'Incline Dumbbell Press', sets: 3, reps: '8', rest: 120 },
            { name: 'Decline Bench Press', sets: 3, reps: '8', rest: 90 },
            { name: 'Pec Deck Fly', sets: 3, reps: '8', rest: 90 },
            { name: 'Lat Pulldown', sets: 3, reps: '8', rest: 90 },
            { name: 'Bent Over', sets: 3, reps: '8', rest: 90 },
            { name: 'Close Grip Row', sets: 3, reps: '8', rest: 90 },
            { name: 'Barbell Squat', sets: 3, reps: '8', rest: 120 },
            { name: 'Romanian Deadlift', sets: 3, reps: '8', rest: 90 },
            { name: 'Standing Calf Raise', sets: 3, reps: '8', rest: 60 }
        ];

        const SA_TTH = [
            { name: 'Shoulder Press', sets: 3, reps: '10', rest: 90 },
            { name: 'Lateral Raise', sets: 3, reps: '12', rest: 60 },
            { name: 'EZ Bar Curl', sets: 3, reps: '15', rest: 60 },
            { name: 'Hammer Curl', sets: 3, reps: '15', rest: 60 },
            { name: 'wrist curl', sets: 3, reps: '20', rest: 60 },
            { name: 'reverse wrist curl', sets: 3, reps: '20', rest: 60 },
            { name: 'face pull', sets: 3, reps: '15', rest: 60 },
            { name: 'Cable Pushdown', sets: 3, reps: '15', rest: 60 },
            { name: 'Overhead Cable Extension', sets: 3, reps: '15', rest: 60 },
            { name: 'shrugs', sets: 3, reps: '15', rest: 60 }
        ];

        const FB_SAT = [
            { name: 'Barbell Bench Press', sets: 3, reps: '8', rest: 120 },
            { name: 'Chest Dips', sets: 3, reps: '8', rest: 90 },
            { name: 'Close Grip Pulldown', sets: 3, reps: '8', rest: 90 },
            { name: 'Hip Thurst', sets: 3, reps: '8', rest: 90 },
            { name: 'Deadlift', sets: 3, reps: '8', rest: 180 },
            { name: 'Leg Extension', sets: 3, reps: '8', rest: 90 },
            { name: 'Leg Curl', sets: 3, reps: '8', rest: 90 },
            { name: 'Hanging Leg Raise', sets: 2, reps: '20', rest: 60 },
            { name: 'Plank', sets: 3, reps: '8', rest: 90 }
        ];

        const ROUTINE_DATA = {
            0: { title: "Sunday - Rest Day", type: "rest", routine: [] },
            1: { title: "Monday - Full Body", type: "workout", routine: FB_MWF },
            2: { title: "Tuesday - Shoulder & Arm", type: "workout", routine: SA_TTH },
            3: { title: "Wednesday - Full Body", type: "workout", routine: FB_MWF },
            4: { title: "Thursday - Shoulder & Arm", type: "workout", routine: SA_TTH },
            5: { title: "Friday - Full Body", type: "workout", routine: FB_MWF },
            6: { title: "Saturday - Full Body", type: "workout", routine: FB_SAT }
        };

        const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const WEEK_LETTERS = ['M', 'T', 'W', 'T', 'F', 'S', 'S']; // Visual bubbles logic expects Mon=index 0
        const JS_DAY_TO_WEEK_IDX = { 1:0, 2:1, 3:2, 4:3, 5:4, 6:5, 0:6 }; // Map JS day (0=Sun) to Mon-Sun array index

        const THEMES = {
            0: '156, 163, 175',  // Sun: Gray 
            1: '59, 130, 246',   // Mon: Blue
            2: '249, 115, 22',   // Tue: Orange
            3: '16, 185, 129',   // Wed: Emerald
            4: '168, 85, 247',   // Thu: Purple
            5: '244, 63, 94',    // Fri: Rose
            6: '6, 182, 212'     // Sat: Cyan
        };

        let state = {
            selectedDayIdx: new Date().getDay(),
            appData: {
                bodyweights: {}, // "YYYY-MM-DD": weight
                workouts: {}     // "YYYY-MM-DD": { completed, volume, sets: { "exIdx_setIdx": weightVal } }
            }
        };

        let timerInterval = null;
        let timerSeconds = 0;

        // Utility to get YYYY-MM-DD format for local timezone
        function getLocalDateString(dateObj) {
            const tzoffset = dateObj.getTimezoneOffset() * 60000; 
            return (new Date(dateObj - tzoffset)).toISOString().split('T')[0];
        }

        // Figure out the date string for the selected day tab (relative to current week)
        function getDateForSelectedTab() {
            const today = new Date();
            const todayIdx = today.getDay();
            const diff = state.selectedDayIdx - todayIdx;
            
            const targetDate = new Date(today);
            targetDate.setDate(today.getDate() + diff);
            
            return getLocalDateString(targetDate);
        }

        function loadData() {
            const stored = localStorage.getItem('jd_tracker_data');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if (parsed.bodyweights && parsed.workouts) {
                        state.appData = parsed;
                    }
                } catch (e) { console.error("Error parsing local storage", e); }
            }
            updateBWDisplay();
        }

        function saveData() {
            localStorage.setItem('jd_tracker_data', JSON.stringify(state.appData));
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-white/10 backdrop-blur-xl border border-white/20 text-white font-bold px-6 py-3 rounded-full shadow-[0_10px_40px_rgba(0,0,0,0.5)] toast-animate mb-2 whitespace-nowrap text-sm';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function applyTheme() {
            const rgb = THEMES[state.selectedDayIdx];
            const root = document.documentElement;
            root.style.setProperty('--theme-base', `rgb(${rgb})`);
            root.style.setProperty('--theme-alpha-10', `rgba(${rgb}, 0.1)`);
            root.style.setProperty('--theme-alpha-20', `rgba(${rgb}, 0.2)`);
            root.style.setProperty('--theme-alpha-30', `rgba(${rgb}, 0.3)`);
            root.style.setProperty('--theme-alpha-50', `rgba(${rgb}, 0.5)`);
        }

        function renderHeaderUI() {
            // Day Tabs
            const tabsContainer = document.getElementById('day-tabs');
            tabsContainer.innerHTML = '';
            
            DAY_NAMES.forEach((dayName, idx) => {
                const isActive = state.selectedDayIdx === idx;
                const isToday = new Date().getDay() === idx;

                let classes = "snap-center flex-shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all duration-300 cursor-pointer border ";
                
                if (isActive) classes += "bg-[var(--theme-base)] border-[var(--theme-base)] text-black shadow-[0_4px_15px_var(--theme-alpha-30)]";
                else classes += "bg-white/5 text-gray-400 border-white/10 hover:bg-white/10";

                const dotHtml = isToday ? `<div class="w-1 h-1 rounded-full mt-1 ${isActive ? 'bg-black' : 'bg-[var(--theme-base)]'}"></div>` : '';
                const btn = document.createElement('button');
                btn.className = classes;
                btn.onclick = () => { state.selectedDayIdx = idx; updateFullUI(); };
                btn.innerHTML = `<div class="flex flex-col items-center"><span>${dayName}</span>${dotHtml}</div>`;
                tabsContainer.appendChild(btn);
            });

            // Weekly Bubbles (Mon-Sun)
            const bubblesContainer = document.getElementById('weekly-bubbles');
            bubblesContainer.innerHTML = '';
            
            const today = new Date();
            const currentDayJS = today.getDay(); // 0-6
            
            // Generate dates for current Mon-Sun week
            for (let i = 0; i < 7; i++) {
                // i=0 is Monday, i=6 is Sunday. Map back to JS dates: Mon=1, Sun=0.
                const jsDayReq = (i === 6) ? 0 : i + 1;
                const diff = jsDayReq - currentDayJS;
                const dateObj = new Date(today);
                dateObj.setDate(today.getDate() + diff);
                const dateStr = getLocalDateString(dateObj);
                
                const wkData = state.appData.workouts[dateStr];
                const isDone = wkData && wkData.completed;
                const bubbleColor = isDone ? `bg-[var(--theme-base)] shadow-[0_0_8px_var(--theme-alpha-50)]` : `bg-black border border-white/10`;
                const textColor = isDone ? `text-black` : `text-gray-600`;

                let bubbleText = WEEK_LETTERS[i];
                if (isDone) {
                    const config = ROUTINE_DATA[jsDayReq];
                    if (config.type === 'rest') {
                        bubbleText = '100%';
                    } else {
                        let totalSets = 0;
                        config.routine.forEach(ex => totalSets += ex.sets);
                        let completedSets = wkData.sets ? Object.keys(wkData.sets).length : 0;
                        let pct = totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 100;
                        bubbleText = `${pct}%`;
                    }
                }

                bubblesContainer.innerHTML += `
                    <div class="h-6 min-w-[24px] px-1.5 rounded-full flex items-center justify-center text-[9px] font-bold ${bubbleColor} ${textColor} transition-all duration-500">
                        ${bubbleText}
                    </div>
                `;
            }
        }

        function renderRoutine() {
            const config = ROUTINE_DATA[state.selectedDayIdx];
            const parts = config.title.split(' - ');
            
            document.getElementById('day-title-main').innerText = parts[1] || parts[0];
            document.getElementById('day-title-sub').innerText = parts.length > 1 ? parts[0] : '';
            
            const targetDateStr = getDateForSelectedTab();
            const todayData = state.appData.workouts[targetDateStr] || { completed: false, sets: {} };
            
            const badge = document.getElementById('day-done-badge');
            badge.style.display = (config.type === 'workout' && todayData.completed) ? 'flex' : 'none';

            const container = document.getElementById('routine-container');
            container.innerHTML = '';

            if (config.type === 'rest') {
                container.innerHTML = `
                    <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-10 text-center shadow-xl mt-10">
                        <div class="text-6xl mb-6 opacity-80 flex justify-center space-x-2"><span>🔋</span></div>
                        <h2 class="text-2xl font-extrabold text-[var(--theme-base)] mb-3 tracking-wide transition-colors duration-500">REST & RECOVER</h2>
                        <p class="text-gray-400 text-sm leading-relaxed">Your muscles grow while you rest. Stay hydrated and eat well.</p>
                    </div>`;
                return;
            }

            let html = '';
            config.routine.forEach((ex, exIndex) => {
                html += `
                <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl shadow-lg p-3 overflow-hidden">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-white text-[14px] leading-tight truncate pr-2">
                            <span class="text-[var(--theme-base)] mr-1">${exIndex + 1}.</span>${ex.name}
                        </h3>
                        <div class="text-[10px] text-[var(--theme-base)] font-bold bg-[var(--theme-alpha-10)] border border-[var(--theme-alpha-20)] px-2 py-1 rounded whitespace-nowrap">
                            ⏱ ${ex.rest}s
                        </div>
                    </div>
                    
                    <!-- Horizontal Sets Row -->
                    <div class="flex overflow-x-auto gap-2 pb-2 hide-scrollbar">
                `;

                for (let setIndex = 0; setIndex < ex.sets; setIndex++) {
                    const key = `${exIndex}_${setIndex}`;
                    const setData = todayData.sets[key];
                    const isCompleted = setData ? true : false;
                    const weightVal = setData ? setData.weight : '';
                    
                    const cardClass = isCompleted ? 'set-completed' : 'bg-black/40 border border-white/5';
                    const icon = isCompleted 
                        ? `<svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`
                        : ``;

                    html += `
                        <div class="set-card flex-shrink-0 rounded-xl p-2 flex items-center justify-between gap-3 min-w-[120px] ${cardClass}">
                            <div class="flex flex-col">
                                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-0.5">Set ${setIndex + 1}</span>
                                <div class="flex items-center">
                                    <input type="number" placeholder="0" value="${weightVal}"
                                        class="weight-input w-10 bg-transparent text-sm font-bold text-white focus:outline-none placeholder:text-gray-700 p-0 m-0"
                                        data-key="${key}" data-reps="${ex.reps}">
                                    <span class="text-[10px] text-gray-500 font-semibold ml-1">kg</span>
                                </div>
                            </div>
                            
                            <button class="set-btn w-7 h-7 rounded-lg border border-white/10 text-gray-400 bg-white/5 flex-shrink-0"
                                data-key="${key}" data-rest="${ex.rest}">
                                ${icon}
                            </button>
                        </div>
                    `;
                }
                html += `</div></div>`; // Close horizontal flex & card
            });

            const btnClass = todayData.completed
                ? 'bg-transparent border-2 border-[var(--theme-alpha-50)] text-[var(--theme-base)]'
                : 'bg-[var(--theme-base)] text-black shadow-[0_10px_30px_var(--theme-alpha-30)] hover:scale-[1.02]';
            const btnText = todayData.completed ? 'Mark as Incomplete' : 'Save Workout';

            html += `<button id="save-workout-btn" class="w-full mt-4 py-4 rounded-2xl font-black text-sm tracking-widest uppercase transition-all duration-300 ${btnClass}">${btnText}</button>`;
            container.innerHTML = html;
        }

        // Calculate total volume for the day based on saved sets
        function calculateVolume(targetDateStr) {
            let total = 0;
            const wkData = state.appData.workouts[targetDateStr];
            if(wkData && wkData.sets) {
                Object.values(wkData.sets).forEach(s => {
                    const weight = parseFloat(s.weight) || 0;
                    // Approximate reps if range given (e.g., "8-12" -> 10). Or just multiply by 10 for standard volume score.
                    // For aesthetic score, we just multiply weight * 10 to keep it simple.
                    total += (weight * 10); 
                });
            }
            return total;
        }

        document.getElementById('routine-container').addEventListener('click', function(e) {
            const checkbox = e.target.closest('.set-btn');
            if (checkbox) {
                const key = checkbox.getAttribute('data-key');
                const rest = parseInt(checkbox.getAttribute('data-rest'));
                const inputEl = checkbox.previousElementSibling.querySelector('.weight-input');
                const weightVal = inputEl.value;

                const targetDateStr = getDateForSelectedTab();
                if (!state.appData.workouts[targetDateStr]) {
                    state.appData.workouts[targetDateStr] = { completed: false, sets: {}, volume: 0 };
                }
                
                const currentData = state.appData.workouts[targetDateStr].sets;
                
                if (currentData[key]) {
                    delete currentData[key]; // Uncheck
                } else {
                    currentData[key] = { weight: weightVal }; // Check
                    if (rest > 0) startTimerUI(rest);
                }
                
                saveData();
                renderRoutine(); 
            }

            if (e.target.id === 'save-workout-btn') {
                const targetDateStr = getDateForSelectedTab();
                if (!state.appData.workouts[targetDateStr]) {
                    state.appData.workouts[targetDateStr] = { completed: false, sets: {}, volume: 0 };
                }
                
                const wk = state.appData.workouts[targetDateStr];
                wk.completed = !wk.completed;
                wk.volume = calculateVolume(targetDateStr);
                
                if (wk.completed) {
                    fireConfetti();
                    showToast("Workout saved to History! 🏆");
                    if (navigator.vibrate) navigator.vibrate([50, 100, 50]);
                } else {
                    showToast("Workout marked incomplete.");
                }

                saveData();
                updateFullUI(); // Update bubbles & routine
            }
        });

        // Save input weights silently on blur to keep focus active during typing
        document.getElementById('routine-container').addEventListener('change', function(e) {
            if (e.target.classList.contains('weight-input')) {
                const key = e.target.getAttribute('data-key');
                const targetDateStr = getDateForSelectedTab();
                
                if (state.appData.workouts[targetDateStr] && state.appData.workouts[targetDateStr].sets[key]) {
                    state.appData.workouts[targetDateStr].sets[key].weight = e.target.value;
                    state.appData.workouts[targetDateStr].volume = calculateVolume(targetDateStr);
                    saveData(); 
                }
            }
        });

        function updateBWDisplay() {
            // Find most recent BW
            const dates = Object.keys(state.appData.bodyweights).sort((a,b) => new Date(b) - new Date(a));
            if (dates.length > 0) {
                document.getElementById('bw-last-display').innerText = state.appData.bodyweights[dates[0]];
            }
        }

        function logBodyweight() {
            const val = document.getElementById('bw-input').value;
            if (val) {
                const targetDateStr = getDateForSelectedTab(); // Log for selected day
                state.appData.bodyweights[targetDateStr] = parseFloat(val);
                saveData();
                updateBWDisplay();
                document.getElementById('bw-input').value = '';
                showToast(`Bodyweight logged: ${val} kg ⚖️`);
            }
        }

        const timerOverlay = document.getElementById('timer-overlay');
        const timerDisplay = document.getElementById('timer-display');

        function formatTime(secs) {
            return `${Math.floor(secs / 60).toString().padStart(2, '0')}:${(secs % 60).toString().padStart(2, '0')}`;
        }

        function startTimerUI(seconds) {
            clearInterval(timerInterval);
            timerSeconds = seconds;
            timerDisplay.innerText = formatTime(timerSeconds);
            
            timerOverlay.classList.remove('opacity-0', 'pointer-events-none', 'hidden');
            timerOverlay.classList.add('opacity-100', 'pointer-events-auto');

            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds <= 0) {
                    stopTimer();
                    if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 400]);
                    showToast("Time to lift! ⚡");
                } else {
                    timerDisplay.innerText = formatTime(timerSeconds);
                }
            }, 1000);
        }

        function addTimerTime(seconds) {
            timerSeconds += seconds;
            timerDisplay.innerText = formatTime(timerSeconds);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerOverlay.classList.remove('opacity-100', 'pointer-events-auto');
            timerOverlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { timerOverlay.classList.add('hidden'); }, 500);
        }

        function fireConfetti() {
            const duration = 2000;
            const end = Date.now() + duration;
            const color = `rgb(${THEMES[state.selectedDayIdx]})`;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: [color, '#ffffff'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: [color, '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function openMonthlyReport() {
            const now = new Date();
            const thresholdTime = now.getTime() - (30 * 24 * 60 * 60 * 1000);
            
            let totalWorkouts = 0;
            let totalVolume = 0;

            // Process Workouts
            Object.keys(state.appData.workouts).forEach(dateStr => {
                const dateObj = new Date(dateStr);
                if (dateObj.getTime() >= thresholdTime) {
                    const wk = state.appData.workouts[dateStr];
                    if (wk.completed) {
                        totalWorkouts++;
                        totalVolume += (wk.volume || 0);
                    }
                }
            });

            // Process Bodyweight
            let bwKeys = Object.keys(state.appData.bodyweights).filter(dateStr => {
                return new Date(dateStr).getTime() >= thresholdTime;
            }).sort((a,b) => new Date(a) - new Date(b)); // oldest first

            let bwChangeStr = "--";
            if (bwKeys.length >= 2) {
                const oldest = state.appData.bodyweights[bwKeys[0]];
                const newest = state.appData.bodyweights[bwKeys[bwKeys.length - 1]];
                const diff = (newest - oldest).toFixed(1);
                bwChangeStr = diff > 0 ? `+${diff} kg` : `${diff} kg`;
            } else if (bwKeys.length === 1) {
                bwChangeStr = "No Change";
            }

            document.getElementById('rep-workouts').innerText = totalWorkouts;
            document.getElementById('rep-volume').innerHTML = `${totalVolume.toLocaleString()} <span class="text-xs text-gray-500">score</span>`;
            
            const repBwEl = document.getElementById('rep-bw');
            repBwEl.innerText = bwChangeStr;
            repBwEl.className = `text-xl font-black ${bwChangeStr.includes('+') ? 'text-green-400' : (bwChangeStr.includes('-') ? 'text-red-400' : 'text-white')}`;

            const modal = document.getElementById('report-modal');
            const card = document.getElementById('report-card');
            
            modal.classList.remove('hidden');
            // Trigger reflow
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function closeMonthlyReport() {
            const modal = document.getElementById('report-modal');
            const card = document.getElementById('report-card');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        // Central UI updater
        function updateFullUI() {
            applyTheme();
            renderHeaderUI();
            renderRoutine();
        }

        // Boot Application
        window.onload = () => {
            loadData();
            updateFullUI();
            
            // Auto-scroll to selected tab slightly after load
            setTimeout(() => {
                const tabs = document.getElementById('day-tabs');
                if (tabs && tabs.children[state.selectedDayIdx]) {
                    tabs.children[state.selectedDayIdx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }, 100);
        };
    </script>
</body>
</html>
